# Despliegue automático en GitHub Pages.
#
# Cada vez que se empuja un cambio a la rama main, este flujo instala las
# dependencias, compila la aplicación para producción y publica el resultado.
# Requiere que en el repositorio esté configurado
#   Settings → Pages → Build and deployment → Source: GitHub Actions
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se cancela el despliegue anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para GitHub Pages
        run: npm run build:ghpages

      - name: Empaquetar el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/corriente-angular/browser

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
